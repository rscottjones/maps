(function() {
  var S = window.__mapShapes;
  function addNum(key, label, fs) {
    S[key] = {
      w: 26, h: 26, anchor: [13, 13], popup: [0, -18], shadow: false,
      svg: (function(n, f) {
        return function(c) {

            + '<circle cx="12" cy="12" r="12" fill="' + c + '"/>'

            + 'font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="' + f + '" fill="#fff">'
            + n + '</text></svg>';
        };
      })(label, fs)
    };
  }
  for (var i = 0; i <= 9; i++) { addNum('circle-' + i, String(i), '16'); }
  for (var j = 0; j <= 99; j++) { var p = (j < 10 ? '0' : '') + j; addNum('circle-' + p, p, '13'); }
  /* Circle-badge versions of FA icons — reuse path data from standalone shapes */

    camera: S.camera, video: S.video, image: S.image, gallery: S.gallery

    S['circle-' + name] = {
      w: 24, h: 24, anchor: [12, 12], popup: [0, -16], shadow: false,
      svg: (function(pathFn) {
        return function(c) {
          /* Extract the path d attribute from the standalone SVG */

          var d = m ? m[1] : '';
          return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">'
            + '<circle cx="12" cy="12" r="12" fill="' + c + '"/>'
            + '<g transform="translate(4,4) scale(0.025)"><path d="' + d + '" fill="#fff"/></g></svg>';
        };
      })(standalone.svg)
    };
  });
